name: Deploy (production)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to deploy"
        default: main

concurrency:
  group: cf-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🧰 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 📥 Install deps
        run: pnpm i --frozen-lockfile

      - name: 🏗️ Build (inject production vars)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ENV_NAME: production
          PUBLIC_UMAMI_SITE_ID: ${{ vars.PUBLIC_UMAMI_SITE_ID }}
          PUBLIC_UMAMI_SHARE_URL: ${{ vars.PUBLIC_UMAMI_SHARE_URL }}
        run: pnpm build

      - name: 🚀 Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
